# RF-DETR large + DA3METRIC-LARGE + SegFormer (Cityscapes, 19 classes) semantic map named
# "scene": pixels of the excluded classes are not used for distance. SegFormer weights live
# in the HF cache weights/hf (download command in README); nothing is downloaded at run time.
# The exclusion list was chosen for street scenes: in agricultural scenes vegetation and
# terrain cover the crop, so review it there. SegFormer is item 0 of `semantic`:
#   --set semantic.0.size=[1024,1792]   (input closer to 16:9)
# Run: det-depth-distance --config configs/rfdetr_semantic_da3.yaml [VIDEO] [--set key=value]...
device: cuda:0
source: {video: _testbed/data/IMG_4021.MOV, start: 0.0, duration: 0.0, max_frames: 0, stride: 1}
detectors:
  - {type: rfdetr, variant: large, threshold: 0.5, classes: driving}
depth:
  type: da3
  model: da3metric-large
  process_res: 504
  process_res_method: upper_bound_resize
  hf_cache: &hf ~/dev/depth-anything-3/_testbed/weights/hf
camera:
  focal_px: null  # focal length in pixels of the input video; takes precedence over estimate
  estimate:
    model: da3-large-1.1
    frames: 16
    process_res: 504
    process_res_method: upper_bound_resize
    hf_cache: *hf
aggregation: {type: concat}
semantic:  # each map is kept apart; excluded labels are "<name>.<class>"
  - name: scene
    type: segformer
    model: nvidia/segformer-b5-finetuned-cityscapes-1024-1024
    hf_cache: weights/hf
    size: [1024, 1024]
distance:
  box_shrink: 0.1
  outlier: iqr
  outlier_k: null
  stat: median
  distance_type: z
  min_valid_px: 20
  max_range: 0.0
  exclude_sky: true
  exclude_semantic: [scene.road, scene.sidewalk, scene.terrain, scene.vegetation]
render:
  layout: overlay
  show_stats: false
  draw_inner_box: false
  max_depth: 30.0
  cmap: turbo
  crf: 20
  hud: true
  font: null
  semantic_alpha: 0.4  # semantic layer tint; 0 = no layer drawn
output: {out_root: _testbed/outputs, tag: "", save_depth: false}
