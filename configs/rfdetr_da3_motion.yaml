# RF-DETR large + DA3METRIC-LARGE with IoU tracking, Kalman smoothing of the
# distance and per-track 2D motion estimation with trajectory prediction
# (task_0009). Tracking and smoothing are those of rfdetr_da3_track.yaml; the
# COCO label map groups car/truck/bus into "vehicle" so the motion model is
# chosen by class. Positions (x right, z forward, metres) come from each box's
# bottom-centre point, its distance and the depth-map intrinsics; heading 0 =
# moving away, +90 deg = moving right. Measurement defaults were measured
# offline on the task_0001 tracks (docs/task_0009.md, Passo 0): rel_floor 2 %
# gives a mean NIS of ~2 on the straight-driving video and nis_gate 30 keeps
# the restarts to id switches and gross jumps; the accel_std values are
# provisional. ego_motion: null keeps everything relative to the camera, so
# the own vehicle's turns read as lateral motion of the objects: every class
# uses constant velocity (ctrv only with ego-motion; see the commented model).
# Validated on the GPU host (pytest -m gpu and utils/gpu_pending.sh step
# 20-motion, 2026-10-23); the visual review of the videos is still pending.
# Run: det-depth-distance --config configs/rfdetr_da3_motion.yaml [VIDEO] [--set key=value]...
device: cuda:0
source: {video: _testbed/data/IMG_4021.MOV, start: 0.0, duration: 0.0, max_frames: 0, stride: 1}
detectors:
  - {type: rfdetr, variant: large, threshold: 0.5, classes: driving,
     labels: configs/labels/coco_driving.yaml}
depth:
  type: da3
  model: da3metric-large
  process_res: 504
  process_res_method: upper_bound_resize
camera:
  focal_px: null  # focal length in pixels of the input video; takes precedence over estimate
  estimate:
    model: da3-large-1.1
    frames: 16
    process_res: 504
    process_res_method: upper_bound_resize
aggregation: {type: concat}
tracking: {type: iou, iou_thr: 0.3, max_age_s: 0.5, motion: constant_velocity,
           velocity_alpha: 0.5, class_aware: false}
smoothing: {filter: kalman, accel_std: 2.0, std_scale: 0.5, rel_floor: 0.01,
            init_speed_std: 5.0, tau_s: 0.1, window_s: 0.15, reset_after_s: 1.0}
# Not to be confused with tracking.motion (the tracker's box prediction).
motion:
  models:
    # With ego_motion, vehicles can use the turn model instead:
    # vehicle: {type: ctrv, accel_std: 3.0, yaw_accel_std: 1.0, warmup_s: 0.5,
    #           init_speed_std: 5.0, init_yaw_rate_std: 0.5, min_speed_for_heading: 1.0}
    vehicle: {type: cv, accel_std: 3.0, init_speed_std: 5.0, min_speed_for_heading: 1.0}
    pedestrian: {type: cv, accel_std: 1.0, init_speed_std: 2.0, min_speed_for_heading: 0.3}
    cv: {type: cv, accel_std: 2.0, init_speed_std: 5.0, min_speed_for_heading: 1.0}
  classes: {vehicle: vehicle, person: pedestrian}
  default: cv
  reset_after_s: 1.0
  nis_gate: 30.0
  measurement: {reference_point: bottom_center, std_scale: 0.5, rel_floor: 0.02, pixel_std: 2.0}
  prediction: {horizon_s: 3.0, step_s: 0.25, n_sigma: 2.0}
  ego_motion: null  # e.g. {type: csv, path: ego.csv, time_offset_s: 0.0} (t, x, y, yaw)
  camera_mount: {x_m: 0.0, y_m: 0.0, yaw_deg: 0.0}
distance:
  box_shrink: 0.1
  outlier: iqr
  outlier_k: null
  stat: median
  distance_type: z
  min_valid_px: 20
  max_range: 0.0
  exclude_sky: true
render:
  layout: overlay
  show_stats: false
  draw_inner_box: false
  max_depth: 30.0
  cmap: turbo
  crf: 20
  hud: true
  font: null
  show_smoothed: true
  show_speed: true
  show_trajectory: true
  trajectory_alpha: 0.8
  show_motion_speed: true
  bev_inset: true
  bev_size: 0.35
  bev_range_m: 40.0
  bev_width_m: 20.0
output: {out_root: _testbed/outputs, tag: "", save_depth: false}
