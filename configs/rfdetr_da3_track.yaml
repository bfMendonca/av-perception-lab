# RF-DETR large + DA3METRIC-LARGE with IoU tracking and per-track Kalman
# smoothing of the distance (task_0006). Defaults were measured offline on the
# task_0001 outputs (their detections.csv; docs/task_0006.md, Facts 3-8):
# IoU >= 0.3 and 0.5 s of track memory keep the lead vehicle under one id;
# class-agnostic matching survives car/truck label flips; constant-velocity
# prediction keeps tracks together up to stride 5 at 30 fps (it breaks at
# 10). The measurement std is max(0.5 * box std, 1 % of the distance); the
# depth noise is correlated in time, so smoothing removes jitter, not bias.
# The raw distance stays in detections.csv (distance_m) next to the smoothed
# one. Not yet validated on the GPU host (docs/task_0006.md, pending runs).
# Run: det-depth-distance --config configs/rfdetr_da3_track.yaml [VIDEO] [--set key=value]...
device: cuda:0
source: {video: _testbed/data/IMG_4021.MOV, start: 0.0, duration: 0.0, max_frames: 0, stride: 1}
detectors:
  - {type: rfdetr, variant: large, threshold: 0.5, classes: driving}
depth:
  type: da3
  model: da3metric-large
  process_res: 504
  process_res_method: upper_bound_resize
camera:
  focal_px: null  # focal length in pixels of the input video; takes precedence over estimate
  estimate:
    model: da3-large-1.1
    frames: 16
    process_res: 504
    process_res_method: upper_bound_resize
aggregation: {type: concat}
tracking: {type: iou, iou_thr: 0.3, max_age_s: 0.5, motion: constant_velocity,
           velocity_alpha: 0.5, class_aware: false}
smoothing: {filter: kalman, accel_std: 2.0, std_scale: 0.5, rel_floor: 0.01,
            init_speed_std: 5.0, tau_s: 0.1, window_s: 0.15, reset_after_s: 1.0}
distance:
  box_shrink: 0.1
  outlier: iqr
  outlier_k: null
  stat: median
  distance_type: z
  min_valid_px: 20
  max_range: 0.0
  exclude_sky: true
render:
  layout: side-by-side
  show_stats: false
  draw_inner_box: false
  max_depth: 30.0
  cmap: turbo
  crf: 20
  hud: true
  font: null
  show_smoothed: true
  show_speed: true
output: {out_root: _testbed/outputs, tag: "", save_depth: false}
