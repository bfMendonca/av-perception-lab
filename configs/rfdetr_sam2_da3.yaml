# RF-DETR large (boxes only) + SAM 2.1 masks from the boxes + DA3METRIC-LARGE: distance
# over each SAM mask. SAM 2.1 weights live in the HF cache weights/hf (download command
# in README, "Pesos dos refinadores e do SegFormer"); nothing is downloaded at run time.
# Run: det-depth-distance --config configs/rfdetr_sam2_da3.yaml [VIDEO] [--set key=value]...
# Other refiners (same options; see README "Refinadores de máscara"): edgetam,
# sam_hq, sam, sam3_tracker (gated) and ultralytics_sam (needs weights:). Switch with
#   --set 'refiners=[{type: edgetam}]'
device: cuda:0
source: {video: _testbed/data/IMG_4021.MOV, start: 0.0, duration: 0.0, max_frames: 0, stride: 1}
detectors:
  - {type: rfdetr, variant: large, threshold: 0.5, classes: driving}
depth:
  type: da3
  model: da3metric-large
  process_res: 504
  process_res_method: upper_bound_resize
camera:
  focal_px: null  # focal length in pixels of the input video; takes precedence over estimate
  estimate:
    model: da3-large-1.1
    frames: 16
    process_res: 504
    process_res_method: upper_bound_resize
aggregation: {type: concat}
refiners:  # box -> mask, after aggregation; weights are never downloaded at run time
  - {type: sam2, model: facebook/sam2.1-hiera-large, targets: missing}
distance:
  box_shrink: 0.1
  outlier: iqr
  outlier_k: null
  stat: median
  distance_type: z
  min_valid_px: 20
  max_range: 0.0
  exclude_sky: true
  region: both  # SAM-mask distance + box distance (box_distance_m) for comparison
render:
  layout: side-by-side
  show_stats: false
  draw_inner_box: false
  max_depth: 30.0
  cmap: turbo
  crf: 20
  hud: true
  font: null
  mask_alpha: 0.35  # instance-mask tint; 0 = no masks drawn
output: {out_root: _testbed/outputs, tag: "", save_depth: false}
