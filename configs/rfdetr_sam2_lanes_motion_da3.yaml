# Full stack on the GPU host: RF-DETR large (boxes, COCO label map -> "vehicle") + SAM 2.1
# masks from the boxes + DA3METRIC-LARGE + TwinLiteNet+ lanes ("lanes": drivable area and
# lane lines; painted lines are excluded from the distance) + IoU tracking + Kalman
# smoothing + per-track motion with predicted trajectories and the BEV inset (task_0009).
# rfdetr_sam2_da3.yaml with the tracking/smoothing of rfdetr_da3_track.yaml and the
# motion section of rfdetr_da3_motion.yaml (cv for every class: no ego-motion). First run
# on the Raspberry Pi highway videos (RPI_0000/0001, 1296x972 @ 25 fps) on 2026-10-23.
# Weights: SAM 2.1 in weights/hf; TwinLiteNet+ from the pinned clone
# weights/_code/TwinLiteNetPlus; fetch with --prepare, nothing is downloaded at run time.
# Run: av-perception-lab --config configs/rfdetr_sam2_lanes_motion_da3.yaml [VIDEO] [--set key=value]...
device: cuda:0
source: {video: _testbed/data/IMG_4021.MOV, start: 0.0, duration: 0.0, max_frames: 0, stride: 1}
detectors:
  - {type: rfdetr, variant: large, threshold: 0.5, classes: driving,
     labels: configs/labels/coco_driving.yaml}
depth:
  type: da3
  model: da3metric-large
  process_res: 504
  process_res_method: upper_bound_resize
camera:
  focal_px: null  # focal length in pixels of the input video; takes precedence over estimate
  estimate:
    model: da3-large-1.1
    frames: 16
    process_res: 504
    process_res_method: upper_bound_resize
aggregation: {type: concat}
refiners:  # box -> mask, after aggregation; weights are never downloaded at run time
  - {type: sam2, model: facebook/sam2.1-hiera-large, targets: missing}
semantic:
  - {name: lanes, type: twinlitenet, variant: large}  # repo: <weights root>/_code/TwinLiteNetPlus
tracking: {type: iou, iou_thr: 0.3, max_age_s: 0.5, motion: constant_velocity,
           velocity_alpha: 0.5, class_aware: false}
smoothing: {filter: kalman, accel_std: 2.0, std_scale: 0.5, rel_floor: 0.01,
            init_speed_std: 5.0, tau_s: 0.1, window_s: 0.15, reset_after_s: 1.0}
# Not to be confused with tracking.motion (the tracker's box prediction).
motion:
  models:
    vehicle: {type: cv, accel_std: 3.0, init_speed_std: 5.0, min_speed_for_heading: 1.0}
    pedestrian: {type: cv, accel_std: 1.0, init_speed_std: 2.0, min_speed_for_heading: 0.3}
    cv: {type: cv, accel_std: 2.0, init_speed_std: 5.0, min_speed_for_heading: 1.0}
  classes: {vehicle: vehicle, person: pedestrian}
  default: cv
  reset_after_s: 1.0
  nis_gate: 30.0
  measurement: {reference_point: bottom_center, std_scale: 0.5, rel_floor: 0.02, pixel_std: 2.0}
  prediction: {horizon_s: 3.0, step_s: 0.25, n_sigma: 2.0}
  ego_motion: null
  camera_mount: {x_m: 0.0, y_m: 0.0, yaw_deg: 0.0}
distance:
  box_shrink: 0.1
  outlier: iqr
  outlier_k: null
  stat: median
  distance_type: z
  min_valid_px: 20
  max_range: 0.0
  mask_erode: 1
  exclude_sky: true
  region: both  # SAM-mask distance + box distance (box_distance_m) for comparison
  exclude_semantic: [lanes.lane]
render:
  layout: side-by-side
  show_stats: false
  draw_inner_box: false
  max_depth: 30.0
  cmap: turbo
  crf: 20
  hud: true
  font: null
  mask_alpha: 0.35
  semantic_alpha: 0.4
  semantic_overlay: null
  show_smoothed: true
  show_speed: true
  show_trajectory: true
  trajectory_alpha: 0.8
  show_motion_speed: true
  bev_inset: true
  bev_size: 0.35
  bev_range_m: 40.0
  bev_width_m: 20.0
output: {out_root: _testbed/outputs, tag: "", save_depth: false}
