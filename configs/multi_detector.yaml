# RF-DETR large (COCO) and YOLO26-L (Objects365) on the same frames + DA3METRIC-LARGE.
# aggregation concat keeps every box, tagged and coloured by its source detector.
# Run: det-depth-distance --config configs/multi_detector.yaml [VIDEO] [--set key=value]...
device: cuda:0
source: {video: _testbed/data/IMG_4021.MOV, start: 0.0, duration: 0.0, max_frames: 0, stride: 1}
detectors:
  - {type: rfdetr, variant: large, threshold: 0.5, classes: driving}
  - type: yolo
    weights: ~/dev/ultralytics/_testbed/weights/yolo26l-objv1-150.pt
    threshold: 0.4
    imgsz: 640
    classes: driving
depth:
  type: da3
  model: da3metric-large
  process_res: 504
  process_res_method: upper_bound_resize
  hf_cache: &hf ~/dev/depth-anything-3/_testbed/weights/hf
camera:
  focal_px: null  # focal length in pixels of the input video; takes precedence over estimate
  estimate:
    model: da3-large-1.1
    frames: 16
    process_res: 504
    process_res_method: upper_bound_resize
    hf_cache: *hf
aggregation: {type: concat}
distance:
  box_shrink: 0.1
  outlier: iqr
  outlier_k: null
  stat: median
  distance_type: z
  min_valid_px: 20
  max_range: 0.0
  exclude_sky: true
render:
  layout: side-by-side
  show_stats: false
  draw_inner_box: false
  max_depth: 30.0
  cmap: turbo
  crf: 20
  hud: true
  font: null
output: {out_root: _testbed/outputs, tag: "", save_depth: false}
