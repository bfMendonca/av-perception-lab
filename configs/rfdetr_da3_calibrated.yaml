# Same as rfdetr_da3.yaml with a calibrated camera. Create the calibration file first
# (docs/refs/protocolo_calibracao_e_referencias.md); cross_check also estimates the focal
# (camera.estimate) to compare it with the calibrated one in metrics.json["camera"].
# Run: det-depth-distance --config configs/rfdetr_da3_calibrated.yaml [VIDEO] [--set key=value]...
device: cuda:0
source: {video: _testbed/data/IMG_4021.MOV, start: 0.0, duration: 0.0, max_frames: 0, stride: 1}
detectors:
  - {type: rfdetr, variant: large, threshold: 0.5, classes: driving}
depth:
  type: da3
  model: da3metric-large
  process_res: 504
  process_res_method: upper_bound_resize
  hf_cache: &hf ~/dev/depth-anything-3/_testbed/weights/hf
camera:
  focal_px: null  # must stay null with a calibration
  calibration:
    path: configs/calibration/iphone14promax_main_1080p30.yaml
    undistort: false  # true: remove lens distortion from every frame (boxes in undistorted px)
    alpha: 0.0  # with undistort: 0 = only valid pixels, 1 = whole field of view
    check_lens: error  # error | warn | off: calibration camera vs the video's QuickTime metadata
    cross_check: true  # also estimate the focal below and record both
  estimate:  # used here only by cross_check
    model: da3-large-1.1
    frames: 16
    process_res: 504
    process_res_method: upper_bound_resize
    hf_cache: *hf
aggregation: {type: concat}
distance:
  box_shrink: 0.1
  outlier: iqr
  outlier_k: null
  stat: median
  distance_type: z
  min_valid_px: 20
  max_range: 0.0
  exclude_sky: true
render:
  layout: overlay
  show_stats: false
  draw_inner_box: false
  max_depth: 30.0
  cmap: turbo
  crf: 20
  hud: true
  font: null
output: {out_root: _testbed/outputs, tag: "", save_depth: false}
