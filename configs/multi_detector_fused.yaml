# RF-DETR large (COCO) and YOLO26-L (Objects365) fused into one list of objects + DA3METRIC-LARGE.
# Each detector maps its labels to a shared canonical vocabulary (configs/labels/);
# WBF merges the boxes of the same object (from both detectors and duplicates of one);
# agreement reports per pair how many objects both detectors see (metrics.json).
# Weights are explicit and neutral: raise one to favour that detector's scores.
# Run: av-perception-lab --config configs/multi_detector_fused.yaml [VIDEO] [--set key=value]...
# Same YAML without fusion: --set 'aggregation={type: concat}' (or aggregation.type=nms)
device: cuda:0
source: {video: _testbed/data/IMG_4021.MOV, start: 0.0, duration: 0.0, max_frames: 0, stride: 1}
detectors:
  - {type: rfdetr, variant: large, threshold: 0.5, classes: driving, labels: configs/labels/coco_driving.yaml}
  - type: yolo
    weights: yolo26l-objv1-150.pt
    threshold: 0.4
    imgsz: 640
    classes: driving
    labels: configs/labels/objects365_driving.yaml
depth:
  type: da3
  model: da3metric-large
  process_res: 504
  process_res_method: upper_bound_resize
camera:
  focal_px: null  # focal length in pixels of the input video; takes precedence over estimate
  estimate:
    model: da3-large-1.1
    frames: 16
    process_res: 504
    process_res_method: upper_bound_resize
aggregation:
  type: wbf
  iou_thr: 0.55
  class_agnostic: false  # options common to nms and wbf only: aggregation.type=nms also works
  weights: {rfdetr-large: 1.0, yolo26l-objv1-150: 1.0}
agreement: {enabled: true, iou_thr: 0.5, class_aware: true}
distance:
  box_shrink: 0.1
  outlier: iqr
  outlier_k: null
  stat: median
  distance_type: z
  min_valid_px: 20
  max_range: 0.0
  exclude_sky: true
render:
  layout: side-by-side
  show_stats: false
  draw_inner_box: false
  max_depth: 30.0
  cmap: turbo
  crf: 20
  hud: true
  font: null
output: {out_root: _testbed/outputs, tag: "", save_depth: false}
