# RF-DETR large + DA3METRIC-LARGE + two semantic segmenters on every frame, in list order:
# "lanes" = TwinLiteNet+ (drivable area and lane lines, BDD100K; code and weights from the
# local clone ~/dev/TwinLiteNetPlus) and "scene" = SegFormer Cityscapes (weights in the HF
# cache weights/hf). `name` is the namespace of the excluded labels (<name>.<class>); the
# maps are not merged, only the exclusion is the union of the listed classes. Example of
# composition, not a validated recommendation: lanes.lane drops painted lane lines (they
# belong to no object), scene.sky backs up DA3's sky, scene.vegetation suits street scenes
# (review it in agricultural scenes). SegFormer is item 1:
#   --set semantic.1.size=[1024,1792]
# Run: det-depth-distance --config configs/rfdetr_lanes_scene_da3.yaml [VIDEO] [--set key=value]...
device: cuda:0
source: {video: _testbed/data/IMG_4021.MOV, start: 0.0, duration: 0.0, max_frames: 0, stride: 1}
detectors:
  - {type: rfdetr, variant: large, threshold: 0.5, classes: driving}
depth:
  type: da3
  model: da3metric-large
  process_res: 504
  process_res_method: upper_bound_resize
  hf_cache: &hf ~/dev/depth-anything-3/_testbed/weights/hf
camera:
  focal_px: null  # focal length in pixels of the input video; takes precedence over estimate
  estimate:
    model: da3-large-1.1
    frames: 16
    process_res: 504
    process_res_method: upper_bound_resize
    hf_cache: *hf
aggregation: {type: concat}
semantic:  # run in this order on every frame
  - {name: lanes, type: twinlitenet, variant: large}  # repo: ~/dev/TwinLiteNetPlus
  - name: scene
    type: segformer
    model: nvidia/segformer-b5-finetuned-cityscapes-1024-1024
    hf_cache: weights/hf
    size: [1024, 1024]
distance:
  box_shrink: 0.1
  outlier: iqr
  outlier_k: null
  stat: median
  distance_type: z
  min_valid_px: 20
  max_range: 0.0
  exclude_sky: true
  exclude_semantic: [lanes.lane, scene.sky, scene.vegetation]
render:
  layout: overlay
  show_stats: false
  draw_inner_box: false
  max_depth: 30.0
  cmap: turbo
  crf: 20
  hud: true
  font: null
  semantic_alpha: 0.4  # semantic layer tint; 0 = no layer drawn
  semantic_overlay: [lanes, scene]  # null = all maps; drawn in list order
output: {out_root: _testbed/outputs, tag: "", save_depth: false}
